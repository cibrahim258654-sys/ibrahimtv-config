name: Daily important matches
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: important-matches
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch important fixtures
        shell: python
        run: |
          import json, urllib.request, datetime, time
          from zoneinfo import ZoneInfo
          from pathlib import Path
          LEAGUES = {
           'uefa.champions':('دوري أبطال أوروبا',95), 'uefa.europa':('الدوري الأوروبي',75),
           'eng.1':('الدوري الإنجليزي',65), 'esp.1':('الدوري الإسباني',65), 'ger.1':('الدوري الألماني',60),
           'ita.1':('الدوري الإيطالي',60), 'fra.1':('الدوري الفرنسي',55), 'ksa.1':('الدوري السعودي',50),
           'caf.champions':('دوري أبطال أفريقيا',85), 'caf.confed':('الكونفدرالية',75), 'caf.nations':('كأس أمم أفريقيا',90),
           'fifa.world':('كأس العالم',100), 'fifa.worldq.caf':('تصفيات كأس العالم أفريقيا',80),
           'fifa.worldq.uefa':('تصفيات كأس العالم أوروبا',80), 'fifa.worldq.afc':('تصفيات كأس العالم آسيا',75),
           'fifa.worldq.conmebol':('تصفيات كأس العالم أمريكا الجنوبية',85), 'uefa.euro':('أمم أوروبا',95),
           'uefa.nations':('دوري الأمم الأوروبية',75), 'uefa.euroq':('تصفيات أمم أوروبا',75),
           'conmebol.america':('كوبا أمريكا',90), 'afc.asian.cup':('كأس آسيا',85)}
          BIG = {'real madrid','barcelona','atletico madrid','liverpool','arsenal','manchester city','manchester united','chelsea','tottenham','bayern munich','borussia dortmund','bayer leverkusen','juventus','internazionale','ac milan','napoli','roma','paris saint-germain','marseille','al hilal','al nassr','al ittihad','al ahli','al ahly','zamalek','pyramids','esperance','mamelodi sundowns','wydad','raja','egypt','brazil','argentina','france','england','spain','germany','portugal','italy','morocco','algeria','senegal','nigeria','tunisia','saudi arabia'}
          
          def important(home, away, base):
              big = sum(any(b == n.lower() or b in n.lower() for b in BIG) for n in (home, away))
              return base + big * 25 if big or base >= 75 else None
          
          def fetch():
              now=datetime.datetime.now(datetime.timezone.utc); cairo=ZoneInfo('Africa/Cairo'); events={}; failures=[]; success=0
              for slug,(label,base) in LEAGUES.items():
                  for delta in (-1,0,1):
                      day=(now+datetime.timedelta(days=delta)).strftime('%Y%m%d')
                      url=f'https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard?dates={day}&limit=100'
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'IbrahimTV fixtures/1.0'})
                          with urllib.request.urlopen(req,timeout=15) as response: data=json.load(response)
                          if not data.get('leagues') or not isinstance(data.get('events'),list): raise ValueError('invalid payload')
                          success+=1
                          for e in data['events']:
                              competition=e.get('competitions',[{}])[0]; teams=competition.get('competitors',[])
                              home=next((t for t in teams if t.get('homeAway')=='home'),None); away=next((t for t in teams if t.get('homeAway')=='away'),None)
                              if not home or not away: continue
                              hn=home['team']['displayName']; an=away['team']['displayName']; rank=important(hn,an,base)
                              if rank is None: continue
                              kickoff=datetime.datetime.fromisoformat(e['date'].replace('Z','+00:00'))
                              local=kickoff.astimezone(cairo).date().isoformat()
                              if local not in {(now.astimezone(cairo)+datetime.timedelta(days=i)).date().isoformat() for i in (0,1)}: continue
                              state=e.get('status',{}).get('type',{}).get('name','')
                              if state in ('STATUS_CANCELED','STATUS_POSTPONED'): continue
                              events[e['id']]={'id':e['id'],'league':label,'home':hn,'away':an,'kickoff':e['date'],'day':local,'homeLogo':home['team'].get('logo',''),'awayLogo':away['team'].get('logo',''),'priority':rank}
                      except Exception as exc: failures.append(slug+':'+day)
                      time.sleep(.15)
              if success < len(LEAGUES)*2: raise RuntimeError('Too many source failures; preserving prior file')
              selected=[]
              for day in sorted({e['day'] for e in events.values()}):
                  top=sorted([e for e in events.values() if e['day']==day],key=lambda e:(-e['priority'],e['kickoff']))[:8]
                  selected.extend(sorted(top,key=lambda e:e['kickoff']))
              payload={'schema':1,'generatedAt':now.isoformat(),'timezone':'Africa/Cairo','partial':bool(failures),'matches':selected}
              Path('matches.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
              print(f'Wrote {len(selected)} important fixtures; successful source requests {success}; failures {len(failures)}')
          if __name__=='__main__': fetch()
      - name: Commit fixture snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git diff --cached --quiet || git commit -m 'Update important matches'
          git pull --rebase origin main
          git push
